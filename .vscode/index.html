<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            padding: 1rem;
        }

        .container { width: 100%; max-width: 420px; }

        h1 {
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
        }

        .search-row {
            display: flex;
            gap: 8px;
            margin-bottom: 1.5rem;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            background: rgba(255,255,255,0.15);
            color: white;
            outline: none;
        }

        input::placeholder { color: rgba(255,255,255,0.6); }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            background: #e94560;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover { background: #c73652; }

        .weather-card {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 2rem;
            color: white;
            display: none;
        }

        .city-name { font-size: 28px; font-weight: 500; margin-bottom: 4px; }
        .country { font-size: 14px; opacity: 0.7; margin-bottom: 1.5rem; }

        .temp-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 8px;
        }

        .temp { font-size: 64px; font-weight: 500; line-height: 1; }
        .temp-unit { font-size: 24px; opacity: 0.8; }
        .condition { font-size: 16px; opacity: 0.8; text-transform: capitalize; margin-bottom: 1.5rem; }

        .divider {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.2);
            margin: 1rem 0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 1rem;
        }

        .stat-label { font-size: 12px; opacity: 0.7; margin-bottom: 6px; }
        .stat-value { font-size: 20px; font-weight: 500; }

        .error {
            text-align: center;
            color: #e94560;
            background: rgba(233,69,96,0.1);
            padding: 1rem;
            border-radius: 12px;
            display: none;
        }

        .loading {
            text-align: center;
            color: white;
            opacity: 0.7;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Weather App</h1>
        <div class="search-row">
            <input type="text" id="cityInput" placeholder="Enter city name..." />
            <button onclick="getWeather()">Search</button>
        </div>
        <p class="loading" id="loading">Fetching weather...</p>
        <p class="error" id="error"></p>
        <div class="weather-card" id="weatherCard">
            <p class="city-name" id="cityName"></p>
            <p class="country" id="country"></p>
            <div class="temp-row">
                <span class="temp" id="temp"></span>
                <span class="temp-unit">°C</span>
            </div>
            <p class="condition" id="condition"></p>
            <hr class="divider">
            <div class="stats-grid">
                <div class="stat">
                    <p class="stat-label">Feels like</p>
                    <p class="stat-value" id="feelsLike"></p>
                </div>
                <div class="stat">
                    <p class="stat-label">Humidity</p>
                    <p class="stat-value" id="humidity"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function getWeather() {
            const city = document.getElementById('cityInput').value.trim();
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const card = document.getElementById('weatherCard');

            if (!city) {
                error.style.display = 'block';
                error.textContent = 'Please enter a city name.';
                card.style.display = 'none';
                return;
            }

            loading.style.display = 'block';
            error.style.display = 'none';
            card.style.display = 'none';

            try {
                const response = await fetch(`https://weatherapp-antaa.azurewebsites.net/api/WeatherFunction?city=${city}`);
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data || 'City not found');
                }

                document.getElementById('cityName').textContent = data.city;
                document.getElementById('country').textContent = data.country;
                document.getElementById('temp').textContent = Math.round(data.temperature);
                document.getElementById('condition').textContent = data.condition;
                document.getElementById('feelsLike').textContent = Math.round(data.feels_like) + '°C';
                document.getElementById('humidity').textContent = data.humidity + '%';

                loading.style.display = 'none';
                card.style.display = 'block';

            } catch (err) {
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = 'City not found. Please try again.';
            }
        }

        document.getElementById('cityInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') getWeather();
        });
    </script>
</body>
</html>
